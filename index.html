<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,height=device-height,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1, viewport-fit=cover" />

  <link rel="icon" href="./favicon.png" sizes="any"><!-- 32×32 -->
  <!-- <link rel="icon" href="./icon.svg" type="image/svg+xml"> -->
  <link rel="apple-touch-icon" href="./favicon.png"> <!-- 180×180 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- <link rel="stylesheet" href="./static/styles/style.css"> -->

</head>
<style>
    @font-face {
        font-family: "Lato";
        src: url("./fonts/Lato-Regular.ttf");
    }
    
    @font-face {
        font-family: "Lato Bold";
        src: url("./fonts/Lato-Bold.ttf");
        font-weight: bold;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
    }

    body {
        position: fixed;
        touch-action: none;
        -webkit-overflow-scrolling: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        -o-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        -moz-transform: translate(-50%, -50%);
        -webkit-transform: translate(-50%, -50%);
        touch-action: none;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        
        /* Crisp rendering for standard content */
        image-rendering: auto;
        -ms-interpolation-mode: bicubic;
        
        /* Prevent blurry rendering */
        transform-origin: center;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        
        /* Ensure pixel-perfect alignment */
        will-change: transform;
        
        /* Prevent rendering artifacts */
        filter: none;
    }

    /* High DPI screen optimizations */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        canvas {
            image-rendering: auto;
        }
    }
</style>
<body>
  <!-- Canvas will be added here by the app -->
</body>
</html>
